<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Acuario ASCII Interactivo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #060a12;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none; /* Evita zoom o scroll al tocar el acuario en el celular */
      user-select: none;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="acuario"></canvas>

  <script>
    const canvas = document.getElementById("acuario");
    const ctx = canvas.getContext("2d");

    // ==========================================
    // 1. CONFIGURACIÓN Y PALETA DE COLORES
    // ==========================================
    const COLOR_FONDO = "#060a12";
    const COLOR_MARCO = "#2d5f82";
    const COLOR_OLA_1 = "#46aadc";
    const COLOR_OLA_2 = "#236496";
    const COLOR_ARENA = "#a07d55";
    const COLOR_HUD = "#50b9e1";
    const COLOR_BURBUJA = "#78d2ff";
    const COLOR_COMIDA = "#ffe678";

    const COLORES_ALGAS = {
      0: "#194b32", // Fondo (oscuro)
      2: "#3cc36e"  // Frente (brillante)
    };

    const COLORES_PECES = {
      0: ["#3c556e", "#4b5f69"],
      1: ["#5aa5d7", "#b46eb9", "#c39150", "#6ebeaa"],
      2: ["#ff734b", "#5aeb91", "#ff5564", "#ffd750"]
    };

    let COLS = 80;
    let ROWS = 30;
    let charW = 10;
    let charH = 18;
    let fontSize = 16;

    // Funciones auxiliares
    const rand = (min, max) => Math.random() * (max - min) + min;
    const randInt = (min, max) => Math.floor(rand(min, max + 1));
    const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];

    // ==========================================
    // 2. CLASES DEL ACUARIO
    // ==========================================
    class Pez {
      constructor(capa) {
        this.capa = capa;
        if (capa === 0) {
          [this.spriteIzq, this.spriteDer] = choice([["<><", "><>"], ["<°><", "><°>"]]);
          this.velBase = rand(3.0, 5.5);
        } else if (capa === 1) {
          [this.spriteIzq, this.spriteDer] = choice([["<°))><", "><((°>"], ["<°)))><", "><(((°>"]]);
          this.velBase = rand(5.5, 8.5);
        } else {
          [this.spriteIzq, this.spriteDer] = choice([
            ["<°)))><", "><(((°>"],
            ["<°)))><", "><(((°>"],
            ["<*(((><", "><)))*>"],
            ["<°)))><>", "<><(((°>"]
          ]);
          this.velBase = rand(7.5, 11.5);
        }

        this.color = choice(COLORES_PECES[capa]);
        this.x = rand(4, Math.max(10, COLS - 10));
        this.y = rand(5, Math.max(10, ROWS - 6));

        const dir = choice([-1, 1]);
        this.vx = this.velBase * dir;
        this.vy = 0;
        this.fase = rand(0, Math.PI * 2);
        this.mirandoDer = dir > 0;
      }

      actualizar(dt, tiempo, objetivo) {
        if (objetivo !== null) {
          const dx = objetivo.x - this.x;
          const dy = objetivo.y - this.y;
          const dist = Math.hypot(dx, dy);

          if (dist > 2.0) {
            const factor = this.capa === 0 ? 0.7 : (this.capa === 1 ? 1.0 : 1.3);
            const velDeseadaX = (dx / dist) * (this.velBase * 1.9 * factor);
            const velDeseadaY = (dy / dist) * (this.velBase * 1.4 * factor);

            const suavizado = 2.8 * dt;
            this.vx += (velDeseadaX - this.vx) * suavizado;
            this.vy += (velDeseadaY - this.vy) * suavizado;
          } else {
            this.vx *= (1 - 2.0 * dt);
            this.vy += Math.sin(tiempo * 3 + this.fase) * 1.5 * dt;
          }
        } else {
          const dirActual = this.mirandoDer ? 1 : -1;
          const velObjX = this.velBase * dirActual;
          const velObjY = Math.sin(tiempo * 1.5 + this.fase) * 1.2;

          this.vx += (velObjX - this.vx) * 1.5 * dt;
          this.vy += (velObjY - this.vy) * 2.0 * dt;
        }

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        if (this.vx > 0.3) this.mirandoDer = true;
        else if (this.vx < -0.3) this.mirandoDer = false;

        const largo = this.spriteDer.length;
        if (this.x < 2) {
          this.x = 2;
          this.vx = Math.abs(this.vx);
          this.mirandoDer = true;
        } else if (this.x > COLS - largo - 2) {
          this.x = COLS - largo - 2;
          this.vx = -Math.abs(this.vx);
          this.mirandoDer = false;
        }

        if (this.y < 4) {
          this.y = 4;
          this.vy = Math.abs(this.vy) * 0.5;
        } else if (this.y > ROWS - 5) {
          this.y = ROWS - 5;
          this.vy = -Math.abs(this.vy) * 0.5;
        }
      }

      dibujar() {
        const sprite = this.mirandoDer ? this.spriteDer : this.spriteIzq;
        dibujarAscii(Math.round(this.x), Math.round(this.y), sprite, this.color);
      }
    }

    class Burbuja {
      constructor(x = null, y = null) {
        this.reiniciar(x, y);
      }

      reiniciar(x = null, y = null) {
        this.x = x !== null ? x : rand(3, COLS - 4);
        this.y = y !== null ? y : rand(ROWS - 6, ROWS - 3);
        this.velY = rand(2.5, 5.5);
        this.fase = rand(0, Math.PI * 2);
      }

      actualizar(dt, tiempo) {
        this.y -= this.velY * dt;
        this.x += Math.sin(tiempo * 3 + this.fase) * 1.2 * dt;
        if (this.y < 3.5) this.reiniciar();
      }

      dibujar() {
        let simbolo = "O";
        if (this.y > ROWS - 10) simbolo = ".";
        else if (this.y > 10) simbolo = "o";
        dibujarAscii(Math.round(this.x), Math.round(this.y), simbolo, COLOR_BURBUJA);
      }
    }

    class Alga {
      constructor(x, altura, capa) {
        this.x = x;
        this.altura = altura;
        this.capa = capa;
        this.color = COLORES_ALGAS[capa];
        this.fase = rand(0, Math.PI * 2);
        this.tipo = choice(["hoja", "tallo"]);
      }

      dibujar(tiempo) {
        const baseY = ROWS - 3;
        for (let i = 0; i < this.altura; i++) {
          const y = baseY - i;
          const onda = Math.sin(tiempo * 2.0 + this.fase + i * 0.6);
          const desp = Math.round(onda * (i / this.altura) * 1.2);

          let simbolo = i % 2 === 0 ? "Y" : "|";
          if (i === this.altura - 1) simbolo = this.tipo === "hoja" ? "T" : "^";
          else if (onda > 0.3) simbolo = ")";
          else if (onda < -0.3) simbolo = "(";

          dibujarAscii(this.x + desp, y, simbolo, this.color);
        }
      }
    }

    class OndaClic {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vida = 1.0;
      }

      actualizar(dt) {
        this.vida -= dt * 1.4;
      }

      dibujar() {
        const gx = Math.round(this.x);
        const gy = Math.round(this.y);
        if (this.vida > 0.65) dibujarAscii(gx, gy, "*", COLOR_COMIDA);
        else if (this.vida > 0.3) dibujarAscii(gx - 1, gy, "(o)", COLOR_BURBUJA);
        else dibujarAscii(gx - 2, gy, "(   )", COLOR_OLA_2);
      }
    }

    // ==========================================
    // 3. DIBUJADO Y ADAPTACIÓN A PANTALLA
    // ==========================================
    function dibujarAscii(col, row, texto, color) {
      if (row >= 0 && row < ROWS) {
        ctx.fillStyle = color;
        ctx.fillText(texto, col * charW, row * charH);
      }
    }

    function dibujarEscenario(tiempo, totalPeces) {
      // Marco
      dibujarAscii(0, 0, "-".repeat(COLS), COLOR_MARCO);
      for (let r = 1; r < ROWS - 2; r++) {
        dibujarAscii(0, r, "|", COLOR_MARCO);
        dibujarAscii(COLS - 1, r, "|", COLOR_MARCO);
      }

      // Olas
      let olaSup = "";
      let olaInf = "";
      for (let c = 1; c < COLS - 1; c++) {
        const v1 = Math.sin(c * 0.22 + tiempo * 2.5);
        const v2 = Math.cos(c * 0.15 - tiempo * 1.8);
        olaSup += v1 > 0.3 ? "-" : (v1 < -0.5 ? "_" : " ");
        olaInf += v2 > 0.4 ? "_" : (v2 < -0.6 ? "-" : " ");
      }
      dibujarAscii(1, 1, olaSup, COLOR_OLA_1);
      dibujarAscii(1, 2, olaInf, COLOR_OLA_2);

      // Arena
      const patron = "._.-._..-_." ;
      const arena = patron.repeat(Math.ceil(COLS / patron.length)).slice(0, COLS - 2);
      dibujarAscii(1, ROWS - 2, arena, COLOR_ARENA);

      // HUD adaptable al ancho del celular
      const ahora = new Date();
      const hora = ahora.toTimeString().slice(0, 5);
      let hud = COLS < 55
        ? ` [ AQUARIUM ] fish:${totalPeces} ${hora} `
        : ` [ AQUARIUM ]   fish:${totalPeces}   time:${hora}   temp:24c   depth:3.2m   `;
      hud += "-".repeat(Math.max(0, COLS - hud.length));
      dibujarAscii(0, ROWS - 1, hud.slice(0, COLS), COLOR_HUD);
    }

    // Estado del acuario
    let peces = [];
    let burbujas = [];
    let plancton = [];
    let algasFondo = [];
    let algasFrente = [];
    let ondas = [];
    let objetivoClic = null;
    let tiempoObjetivo = 0;

    function inicializarMundo() {
      // Ajustar tamaño de fuente según el dispositivo
      fontSize = window.innerWidth < 600 ? 14 : 18;
      ctx.font = `bold ${fontSize}px Consolas, "Courier New", monospace`;
      charW = ctx.measureText("M").width;
      charH = fontSize * 1.2;

      COLS = Math.max(30, Math.floor(window.innerWidth / charW));
      ROWS = Math.max(20, Math.floor(window.innerHeight / charH));

      canvas.width = COLS * charW;
      canvas.height = ROWS * charH;

      // Reaplicar fuente tras cambiar tamaño del canvas
      ctx.font = `bold ${fontSize}px Consolas, "Courier New", monospace`;
      ctx.textBaseline = "top";

      peces = [
        ...Array.from({ length: 4 }, () => new Pez(0)),
        ...Array.from({ length: 5 }, () => new Pez(1)),
        ...Array.from({ length: 7 }, () => new Pez(2))
      ];
      burbujas = Array.from({ length: 14 }, () => new Burbuja());
      plancton = Array.from({ length: 18 }, () => ({
        x: randInt(3, COLS - 4),
        y: randInt(4, ROWS - 5)
      }));

      algasFondo = [];
      for (let x = 5; x < COLS - 5; x += 9) algasFondo.push(new Alga(x, randInt(4, 7), 0));

      algasFrente = [];
      for (let x = 3; x < COLS - 5; x += 11) algasFrente.push(new Alga(x, randInt(5, 9), 2));
    }

    // ==========================================
    // 4. INTERACCIÓN (CLIC Y PANTALLA TÁCTIL)
    // ==========================================
    canvas.addEventListener("pointerdown", (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      const gx = Math.max(3, Math.min(COLS - 4, mx / charW));
      const gy = Math.max(4, Math.min(ROWS - 5, my / charH));

      objetivoClic = { x: gx, y: gy };
      tiempoObjetivo = 4.5;
      ondas.push(new OndaClic(gx, gy));
      burbujas.push(new Burbuja(gx, gy));
    });

    window.addEventListener("resize", inicializarMundo);

    // ==========================================
    // 5. BUCLE PRINCIPAL (60 FPS)
    // ==========================================
    let ultimoTiempo = performance.now();
    let tiempoTotal = 0;

    function bucle(ahora) {
      const dt = Math.min((ahora - ultimoTiempo) / 1000, 0.05);
      ultimoTiempo = ahora;
      tiempoTotal += dt;

      if (tiempoObjetivo > 0) {
        tiempoObjetivo -= dt;
        if (tiempoObjetivo <= 0) objetivoClic = null;
      }

      // Actualizar
      for (const p of peces) p.actualizar(dt, tiempoTotal, objetivoClic);
      for (const b of burbujas) b.actualizar(dt, tiempoTotal);
      for (let i = ondas.length - 1; i >= 0; i--) {
        ondas[i].actualizar(dt);
        if (ondas[i].vida <= 0) ondas.splice(i, 1);
      }
      if (burbujas.length > 22) burbujas.shift();

      // Dibujar fondo y escenario
      ctx.fillStyle = COLOR_FONDO;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      dibujarEscenario(tiempoTotal, peces.length);

      // CAPA 0: Fondo
      for (const pl of plancton) dibujarAscii(pl.x, pl.y, ".", "#1e324b");
      for (const a of algasFondo) a.dibujar(tiempoTotal);
      for (const p of peces) if (p.capa === 0) p.dibujar();

      // CAPA 1: Intermedia
      for (const b of burbujas) b.dibujar();
      for (const o of ondas) o.dibujar();
      for (const p of peces) if (p.capa === 1) p.dibujar();

      // CAPA 2: Primer plano
      for (const a of algasFrente) a.dibujar(tiempoTotal);
      for (const p of peces) if (p.capa === 2) p.dibujar();

      requestAnimationFrame(bucle);
    }

    inicializarMundo();
    requestAnimationFrame(bucle);
  </script>
</body>
</html>
